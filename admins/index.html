<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admins — ATC PROJECTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=8" />
  <link rel="stylesheet" href="/admins/admins.css?v=7" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
</head>
<body class="admins-body">
  <header class="site-header is-scrolled admins-header">
    <a class="brand" href="/" aria-label="ATC PROJECTS — Accueil">
      <img src="/assets/logo.png" alt="ATC PROJECTS" class="brand__logo brand__logo--on-light" width="120" height="66" style="display:block;filter:none" />
    </a>
    <div class="admins-header__actions">
      <a href="/">← Retour au site</a>
      <button type="button" id="logout-btn" class="btn btn--primary" hidden>Déconnexion</button>
    </div>
  </header>

  <div id="login-view" class="admins-login">
    <form id="login-form" class="admins-card">
      <p class="kicker">Espace admins</p>
      <h1 class="h2">ATC PROJECTS</h1>
      <p class="admins-muted">Modifiez les textes et images du site.</p>
      <label class="admins-label">
        Mot de passe
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </label>
      <p class="admins-muted">Mot de passe : <code>atcadmin2024</code></p>
      <p id="login-error" class="admins-error" hidden></p>
      <button type="submit" class="btn btn--primary">Entrer</button>
    </form>
  </div>

  <div id="app-view" class="admins-app" hidden>
    <aside class="admins-nav" id="section-nav"></aside>
    <main class="admins-main">
      <div class="admins-top">
        <div>
          <p class="kicker" id="panel-kicker">Édition</p>
          <h1 class="h2" id="panel-title">Contenu</h1>
        </div>
        <button type="button" class="btn btn--primary" id="save-btn">Enregistrer</button>
      </div>
      <p id="toast" class="admins-toast" hidden></p>
      <div id="panels"></div>
    </main>
  </div>

  <script src="/admins/admins.js?v=15"></script>
</body>
</html>
