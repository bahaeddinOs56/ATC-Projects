[build]
  command = "mkdir -p dist && cp index.html 404.html dist/ && cp -r css js assets data admins dist/"
  publish = "dist"

[[redirects]]
  from = "/api/content"
  to = "/data/content.json"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/data/content.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
